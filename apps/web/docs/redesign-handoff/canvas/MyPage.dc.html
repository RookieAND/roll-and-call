<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
  <style>
    body { margin: 0; background: #ffffff; font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #4f46e5; } a:hover { color: #4338ca; }
  </style>
</helmet>
<div style="width: 412px; height: 915px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-left: 1px solid #eaeaef; border-right: 1px solid #eaeaef; color: #17171c; font-family: &quot;Pretendard Variable&quot;, Pretendard, &quot;Noto Sans KR&quot;, system-ui, sans-serif;">
  <div style="flex: 1; min-height: 0;">
    <header style="height: 52px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 14px; border-bottom: 1px solid #eaeaef; background: #ffffff;">
      <span style="font-size: 18px; line-height: 1.3; font-weight: 700; letter-spacing: -0.025em; color: #17171c;">마이페이지</span>
    </header>
    <div style="padding: 24px 16px; display: flex; flex-direction: column; gap: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 60px; height: 60px; border-radius: 9999px; background: #E0E7FF; color: #4338CA; display: flex; align-items: center; justify-content: center; font-size: 20px; line-height: 1.4; font-weight: 700; flex-shrink: 0;">도</div>
          <div style="font-size: 19px; line-height: 1.25; font-weight: 800; letter-spacing: -0.025em; color: #17171c;">도토리</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div style="width: 36px; height: 36px; box-sizing: border-box; border: 1px solid #eaeaef; border-radius: 6px; color: #5f5f6b; display: flex; align-items: center; justify-content: center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg>
          </div>
          <div style="width: 36px; height: 36px; box-sizing: border-box; border: 1px solid #eaeaef; border-radius: 6px; color: #5f5f6b; display: flex; align-items: center; justify-content: center;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 9px;">
        <div style="flex: 1; box-sizing: border-box; display: flex; flex-direction: column; padding: 14px; border: 1px solid #eaeaef; border-radius: 14px; background: #ffffff;">
          <div style="font-size: 24px; line-height: 1; font-weight: 800; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; color: #17171c;">0</div>
          <div style="margin-top: 6px; font-size: 12px; line-height: 1.4; font-weight: 600; color: #5f5f6b;">참여 예정</div>
        </div>
        <div style="flex: 1; box-sizing: border-box; display: flex; flex-direction: column; padding: 14px; border: 1px solid #eaeaef; border-radius: 14px; background: #ffffff;">
          <div style="font-size: 24px; line-height: 1; font-weight: 800; letter-spacing: -0.025em; font-variant-numeric: tabular-nums; color: #17171c;">1</div>
          <div style="margin-top: 6px; font-size: 12px; line-height: 1.4; font-weight: 600; color: #5f5f6b;">운영 중</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div style="display: flex; align-items: baseline; gap: 4px;">
            <h2 style="margin: 0; font-size: 13.5px; line-height: 1.5; font-weight: 800; color: #17171c;">참여 예정인 세션</h2>
            <span style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.4; color: #70707a;">0</span>
          </div>
        </div>
        <div style="box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px; border: 1px dashed #dcdce4; border-radius: 16px; text-align: center;">
          <!-- stand-in for /empty-states/empty-my-games.png (104x104 illustration) -->
          <svg width="104" height="104" viewBox="0 0 104 104" fill="none">
            <ellipse cx="54" cy="84" rx="31" ry="4" fill="#f2f2f6"></ellipse>
            <rect x="12" y="30" width="30" height="42" rx="3" transform="rotate(-24 27 51)" fill="#f2f2f6" stroke="#8a8a95" stroke-width="1.2"></rect>
            <rect x="30" y="24" width="30" height="46" rx="3" transform="rotate(-6 45 47)" fill="#f2f2f6" stroke="#8a8a95" stroke-width="1.2"></rect>
            <rect x="44" y="28" width="32" height="46" rx="3" transform="rotate(10 60 51)" fill="#f2f2f6" stroke="#4f46e5" stroke-width="1.6"></rect>
          </svg>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
            <span style="font-size: 14px; line-height: 1.4; font-weight: 700; color: #17171c;">아직 참여 예정인 세션이 없습니다</span>
          </div>
          <div style="height: 32px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; padding: 0 12px; border-radius: 12px; background: #4f46e5; color: #ffffff; font-size: 14px; line-height: 20px; font-weight: 600;">구인 목록 보기</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div style="display: flex; align-items: baseline; gap: 4px;">
            <h2 style="margin: 0; font-size: 13.5px; line-height: 1.5; font-weight: 800; color: #17171c;">운영 중인 세션</h2>
            <span style="font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; line-height: 1.4; color: #70707a;">1</span>
          </div>
          <span style="display: inline-flex; align-items: center; gap: 2px; font-size: 12px; line-height: 1.4; font-weight: 600; color: #4f46e5;">더 보기 <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="box-sizing: border-box; padding: 14px; border: 1px solid #eaeaef; border-radius: 13px;">
            <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
              <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
                <span style="font-size: 14px; line-height: 1.4; font-weight: 700; color: #17171c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">안개 속의 저택</span>
              </div>
              <span style="display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 6px; background: #f2f2f6; color: #5f5f6b; font-size: 11px; line-height: 1; font-weight: 700;">마감 D-9</span>
            </div>
            <div style="margin-top: 4px; font-size: 12px; line-height: 1.4; color: #5f5f6b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"><b style="font-weight: 700; color: #5f5f6b;">모집 중</b> · 0 / 4명</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav style="height: 58px; box-sizing: border-box; flex-shrink: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #eaeaef; background: #ffffff;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #70707a;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h.01"></path><path d="M3 12h.01"></path><path d="M3 19h.01"></path><path d="M8 5h13"></path><path d="M8 12h13"></path><path d="M8 19h13"></path></svg>
      <span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #70707a;">구인 목록</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #4f46e5;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #4f46e5;">마이페이지</span>
    </div>
  </nav>
</div>
</x-dc>
</body>
</html>
