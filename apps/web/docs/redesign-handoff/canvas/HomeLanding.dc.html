<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            background: #ffffff;
            font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
          }
          a {
            color: #4f46e5;
          }
          a:hover {
            color: #4338ca;
          }
        </style>
      </helmet>
      <div
        style="
          width: 412px;
          height: 915px;
          box-sizing: border-box;
          border-left: 1px solid #eaeaef;
          border-right: 1px solid #eaeaef;
          background: #ffffff;
          color: #17171c;
          display: flex;
          flex-direction: column;
        "
      >
        <div
          style="
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 24px;
            padding-bottom: 40px;
          "
        >
          <div style="padding: 44px 24px 8px 24px">
            <div style="display: flex; flex-direction: column; gap: 16px">
              <div style="display: flex; align-items: center; gap: 8px">
                <span
                  style="width: 26px; height: 26px; border-radius: 8px; background: #4f46e5"
                ></span>
                <span style="font-size: 16px; line-height: 1.4; font-weight: 700; color: #17171c"
                  >롤앤콜</span
                >
              </div>
              <h1
                style="
                  margin: 0;
                  font-size: 28px;
                  line-height: 1.375;
                  font-weight: 800;
                  letter-spacing: -0.035em;
                  color: #17171c;
                "
              >
                TRPG 세션, 모집부터<br />일정 확정까지 한 곳에서
              </h1>
              <span style="font-size: 14px; line-height: 1.625; font-weight: 400; color: #5f5f6b"
                >구인 글을 올려 플레이어를 모으고, 서로 가능한 시간을 겹쳐 세션 일시를
                정합니다.</span
              >
              <div
                style="
                  height: 48px;
                  padding: 0 24px;
                  border-radius: 12px;
                  background: #5865f2;
                  color: #ffffff;
                  box-shadow: 0 6px 18px rgba(88, 101, 242, 0.24);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  gap: 8px;
                  font-size: 15px;
                  font-weight: 600;
                "
              >
                <span
                  style="width: 8px; height: 8px; border-radius: 9999px; background: #ffffff"
                ></span>
                <span>Discord로 로그인</span>
              </div>
              <span
                style="
                  font-size: 12px;
                  line-height: 1.4;
                  font-weight: 400;
                  color: #5f5f6b;
                  text-align: center;
                "
                >디스코드 계정으로 시작합니다. 닉네임과 아바타만 가져옵니다.</span
              >
            </div>
          </div>
          <div
            style="
              border-top: 1px solid #f2f2f6;
              padding: 24px 24px 0 24px;
              display: flex;
              flex-direction: column;
              gap: 12px;
            "
          >
            <div style="display: flex; justify-content: space-between; align-items: center">
              <span style="font-size: 14px; line-height: 1.4; font-weight: 700; color: #17171c"
                >지금 모집 중</span
              >
              <span
                style="
                  display: inline-flex;
                  align-items: center;
                  gap: 2px;
                  font-size: 14px;
                  line-height: 1.5;
                  color: #4f46e5;
                "
                >전체 보기
                <svg
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="m9 18 6-6-6-6"></path></svg
              ></span>
            </div>
            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                border-radius: 14px;
                border: 1px solid #eaeaef;
                padding: 12px;
              "
            >
              <span
                style="
                  width: 34px;
                  height: 34px;
                  flex-shrink: 0;
                  border-radius: 9999px;
                  background: #fbe2ec;
                  color: #a03f6b;
                  font-size: 13px;
                  font-weight: 700;
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                "
                >한</span
              >
              <div style="min-width: 0; flex: 1; display: flex; flex-direction: column">
                <span
                  style="
                    font-size: 14px;
                    line-height: 1.4;
                    font-weight: 700;
                    color: #17171c;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                  "
                  >마지막 열차</span
                >
                <span
                  style="
                    font-size: 12px;
                    line-height: 1.4;
                    color: #5f5f6b;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                  "
                  >피아스코 · GM 한밤의GM</span
                >
              </div>
              <span
                style="
                  font-size: 14px;
                  line-height: 1.4;
                  font-weight: 700;
                  color: #17171c;
                  font-variant-numeric: tabular-nums;
                "
                >2/4</span
              >
            </div>
            <div
              style="
                display: flex;
                align-items: center;
                gap: 12px;
                border-radius: 14px;
                border: 1px solid #eaeaef;
                padding: 12px;
              "
            >
              <span
                style="
                  width: 34px;
                  height: 34px;
                  flex-shrink: 0;
                  border-radius: 9999px;
                  background: #e2f0fb;
                  color: #2c6ba0;
                  font-size: 13px;
                  font-weight: 700;
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                "
                >달</span
              >
              <div style="min-width: 0; flex: 1; display: flex; flex-direction: column">
                <span
                  style="
                    font-size: 14px;
                    line-height: 1.4;
                    font-weight: 700;
                    color: #17171c;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                  "
                  >심해 연구소 7호</span
                >
                <span
                  style="
                    font-size: 12px;
                    line-height: 1.4;
                    color: #5f5f6b;
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                  "
                  >CoC 7th · GM 달빛여우</span
                >
              </div>
              <span
                style="
                  font-size: 14px;
                  line-height: 1.4;
                  font-weight: 700;
                  color: #17171c;
                  font-variant-numeric: tabular-nums;
                "
                >2/2</span
              >
            </div>
          </div>
        </div>
        <nav
          style="
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            height: 58px;
            box-sizing: border-box;
            border-top: 1px solid #eaeaef;
            background: #ffffff;
            flex-shrink: 0;
          "
        >
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 6px;
              color: #70707a;
            "
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 5h.01"></path>
              <path d="M3 12h.01"></path>
              <path d="M3 19h.01"></path>
              <path d="M8 5h13"></path>
              <path d="M8 12h13"></path>
              <path d="M8 19h13"></path>
            </svg>
            <span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #70707a"
              >구인 목록</span
            >
          </div>
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 6px;
              color: #70707a;
            "
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #70707a"
              >마이페이지</span
            >
          </div>
        </nav>
      </div>
    </x-dc>
  </body>
</html>
