<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            background: #ffffff;
            font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
          }
          a {
            color: #4f46e5;
          }
          a:hover {
            color: #4338ca;
          }
        </style>
      </helmet>
      <div
        style="
          width: 412px;
          height: 915px;
          box-sizing: border-box;
          border-left: 1px solid #eaeaef;
          border-right: 1px solid #eaeaef;
          background: #ffffff;
          color: #17171c;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        "
      >
        <header
          style="
            height: 52px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 14px;
            border-bottom: 1px solid #eaeaef;
            background: #ffffff;
            flex-shrink: 0;
          "
        >
          <div
            style="
              width: 36px;
              height: 36px;
              margin-left: -6px;
              border-radius: 6px;
              display: flex;
              align-items: center;
              justify-content: center;
              color: #5f5f6b;
              flex-shrink: 0;
            "
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </div>
          <span
            style="
              font-size: 16px;
              line-height: 1.4;
              font-weight: 700;
              letter-spacing: -0.4px;
              color: #17171c;
              white-space: nowrap;
              overflow: hidden;
              text-overflow: ellipsis;
            "
            >안개 속의 저택 · 일정 조율</span
          >
          <span style="flex: 1"></span>
        </header>
        <div style="flex: 1; padding: 24px 16px">
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #5f5f6b">
            일시가 지정된 게임이라 조율이 필요 없어요.
          </p>
        </div>
        <nav
          style="
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            height: 58px;
            box-sizing: border-box;
            border-top: 1px solid #eaeaef;
            background: #ffffff;
            flex-shrink: 0;
          "
        >
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 6px;
              color: #4f46e5;
            "
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 5h.01"></path>
              <path d="M3 12h.01"></path>
              <path d="M3 19h.01"></path>
              <path d="M8 5h13"></path>
              <path d="M8 12h13"></path>
              <path d="M8 19h13"></path>
            </svg>
            <span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #4f46e5"
              >구인 목록</span
            >
          </div>
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 6px;
              color: #70707a;
            "
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #70707a"
              >마이페이지</span
            >
          </div>
        </nav>
      </div>
    </x-dc>
  </body>
</html>
