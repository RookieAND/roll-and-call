<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            background: #ffffff;
            font-family: "Pretendard Variable", Pretendard, "Noto Sans KR", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
          }
          a {
            color: #4f46e5;
          }
          a:hover {
            color: #4338ca;
          }
        </style>
      </helmet>
      <div
        style="
          width: 412px;
          height: 915px;
          box-sizing: border-box;
          border-left: 1px solid #eaeaef;
          border-right: 1px solid #eaeaef;
          background: #ffffff;
          color: #17171c;
          display: flex;
          flex-direction: column;
        "
      >
        <div style="flex: 1">
          <div
            style="
              min-height: 640.5px;
              padding: 0 20px;
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 20px;
              text-align: center;
            "
          >
            <svg
              width="140"
              height="140"
              viewBox="0 0 512 512"
              fill="none"
              stroke-linejoin="round"
              stroke-linecap="round"
            >
              <ellipse cx="256" cy="345" rx="170" ry="30" fill="#f2f2f6"></ellipse>
              <path
                d="M128 145 Q128 130 142 131 L385 138 Q398 139 398 152 L396 230 L352 232 L337 246 L173 231 L158 241 L126 224 Z"
                fill="#f2f2f6"
                stroke="#8a8a95"
                stroke-width="5"
              ></path>
              <polyline
                points="130,226 158,241 173,231 337,246 352,232 386,232"
                stroke="#4f46e5"
                stroke-width="6"
              ></polyline>
              <path
                d="M120 255 L152 247 L163 262 L178 252 L345 268 L360 254 L390 252 Q398 252 398 262 L396 342 Q396 355 383 354 L132 346 Q118 345 118 332 Z"
                fill="#eaeaef"
                stroke="#8a8a95"
                stroke-width="5"
              ></path>
            </svg>
            <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
              <span style="font-size: 16px; line-height: 1.4; font-weight: 700; color: #17171c"
                >페이지를 찾을 수 없습니다</span
              >
              <span style="font-size: 14px; line-height: 1.5; color: #5f5f6b"
                >주소가 바뀌었거나 삭제된 페이지예요.</span
              >
            </div>
            <div style="display: flex; gap: 8px">
              <div
                style="
                  height: 40px;
                  padding: 0 16px;
                  border-radius: 12px;
                  background: #4f46e5;
                  color: #ffffff;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 14px;
                  font-weight: 600;
                "
              >
                메인으로 돌아가기
              </div>
            </div>
          </div>
        </div>
        <nav
          style="
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            height: 58px;
            box-sizing: border-box;
            border-top: 1px solid #eaeaef;
            background: #ffffff;
            flex-shrink: 0;
          "
        >
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 6px;
              color: #70707a;
            "
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 5h.01"></path>
              <path d="M3 12h.01"></path>
              <path d="M3 19h.01"></path>
              <path d="M8 5h13"></path>
              <path d="M8 12h13"></path>
              <path d="M8 19h13"></path>
            </svg>
            <span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #70707a"
              >구인 목록</span
            >
          </div>
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 6px;
              color: #70707a;
            "
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span style="font-size: 12px; line-height: 1.4; font-weight: 700; color: #70707a"
              >마이페이지</span
            >
          </div>
        </nav>
      </div>
    </x-dc>
  </body>
</html>
